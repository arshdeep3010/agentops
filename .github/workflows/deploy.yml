name: deploy

# After ci passes on main: build the three images, push them to ECR, point the four Lambda
# functions at them, then check the live /health. Also runnable by hand (Actions > deploy).
# Does nothing until the repository variables from `terraform output github_variables` are set,
# so forks and a fresh clone don't fail here.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC token for AWS: no AWS keys stored in GitHub
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      NAME: ${{ vars.APP_NAME || 'agentops' }}
      # The commit ci tested (workflow_run), or the branch head (manual run).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Lambda needs plain single-platform images: no provenance attestations.
      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          build() {  # repo dockerfile [target]
            local image="$REGISTRY/$NAME-$1"
            docker build --provenance=false --platform linux/amd64 -f "$2" ${3:+--target "$3"} \
              -t "$image:$SHA" -t "$image:latest" .
            docker push "$image:$SHA"
            docker push "$image:latest"
          }
          build api lambda.Dockerfile api
          build worker lambda.Dockerfile worker
          build sandbox sandbox/lambda.Dockerfile

      # On the very first run the functions don't exist yet (create_functions = false):
      # the images are pushed, and Terraform creates the functions from them next.
      - name: Update functions
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          update() {  # function repo
            if ! aws lambda get-function --function-name "$1" >/dev/null 2>&1; then
              echo "::notice::$1 doesn't exist yet. Images are pushed; apply Terraform with create_functions = true."
              return
            fi
            aws lambda update-function-code --function-name "$1" \
              --image-uri "$REGISTRY/$NAME-$2:$SHA" --query 'LastUpdateStatus' --output text
            aws lambda wait function-updated-v2 --function-name "$1"
            echo "$1 -> $SHA"
          }
          update "$NAME-sandbox" sandbox
          update "$NAME-preview" sandbox
          update "$NAME-worker" worker
          update "$NAME-api" api

      - name: Check the live app
        run: |
          set -euo pipefail
          url=$(aws lambda get-function-url-config --function-name "$NAME-api" --query FunctionUrl --output text 2>/dev/null || true)
          if [ -z "$url" ] || [ "$url" = "None" ]; then echo "No function URL yet."; exit 0; fi
          for i in 1 2 3 4 5 6; do
            if body=$(curl -fsS --max-time 30 "${url%/}/health"); then echo "$body"; echo "Live: $url"; exit 0; fi
            echo "not ready yet ($i)"; sleep 10
          done
          echo "::error::$url/health did not answer. Is database_url set in SSM? See infra/README.md."
          exit 1
