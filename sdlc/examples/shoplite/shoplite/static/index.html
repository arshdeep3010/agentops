<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopLite</title>
<style>
  :root { --bg: #fafafa; --card: #fff; --ink: #111; --muted: #6b6b6b; --line: #e6e6e6; --ok: #127a3a; --bad: #b42318; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
  header b { font-size: 20px; letter-spacing: -0.02em; }
  header span { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 24px; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; align-content: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .art { font-size: 44px; height: 96px; display: grid; place-items: center; background: #f3f3f3; border-radius: 10px; }
  .name { margin-top: 12px; font-weight: 600; }
  .price { color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: #fff; padding: 9px 14px; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); padding: 2px 8px; }
  button:disabled { opacity: 0.4; cursor: default; }
  .card button.add { width: 100%; margin-top: 12px; }
  aside h2 { margin: 0 0 12px; font-size: 16px; }
  .line { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; padding: 6px 0; }
  .row.total { font-size: 18px; border-top: 1px solid var(--ink); margin-top: 6px; padding-top: 10px; }
  .muted { color: var(--muted); }
  #checkout { width: 100%; margin-top: 14px; padding: 12px; }
  #message { margin-top: 12px; min-height: 22px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; min-width: 0; flex: 1; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><b>ShopLite</b><span>A tiny demo shop</span></header>
<main>
  <section class="grid" id="products" aria-label="Products"></section>
  <aside class="card" aria-label="Cart">
    <h2>Your cart</h2>
    <div id="lines"><p class="muted">Your cart is empty.</p></div>
    <div class="row"><span class="muted">Subtotal</span><span id="subtotal">₹0.00</span></div>
    <div class="row total"><span>Total</span><b id="total">₹0.00</b></div>
    <button id="checkout" disabled>Checkout</button>
    <div id="message" role="status"></div>
  </aside>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const money = (paise) => "₹" + (paise / 100).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);

  async function api(path, options = {}) {
    const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...options});
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || "Something went wrong");
    return body;
  }

  function say(text, kind) {
    $("#message").className = kind || "";
    $("#message").textContent = text;
  }

  function renderCart(cart) {
    $("#lines").innerHTML = cart.lines.length ? cart.lines.map((l) => `
      <div class="line">
        <span>${l.emoji} ${esc(l.name)} × ${l.quantity}</span>
        <span>${money(l.amount)} <button class="ghost" data-remove="${esc(l.product_id)}" aria-label="Remove ${esc(l.name)}">×</button></span>
      </div>`).join("") : `<p class="muted">Your cart is empty.</p>`;
    $("#subtotal").textContent = money(cart.subtotal);
    $("#total").textContent = money(cart.total);
    $("#checkout").disabled = !cart.lines.length;
    document.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", async () => {
      renderCart(await api(`/api/cart/items/${b.dataset.remove}`, {method: "DELETE"}));
    }));
  }

  async function load() {
    const products = await api("/api/products");
    $("#products").innerHTML = products.map((p) => `
      <div class="card">
        <div class="art" aria-hidden="true">${p.emoji}</div>
        <div class="name">${esc(p.name)}</div>
        <div class="price">${money(p.price)}</div>
        <button class="add" data-add="${esc(p.id)}">Add to cart</button>
      </div>`).join("");
    document.querySelectorAll("[data-add]").forEach((b) => b.addEventListener("click", async () => {
      try { renderCart(await api("/api/cart/items", {method: "POST", body: JSON.stringify({product_id: b.dataset.add})})); say(""); }
      catch (e) { say(e.message, "bad"); }
    }));
    renderCart(await api("/api/cart"));
  }

  $("#checkout").addEventListener("click", async () => {
    try {
      const order = await api("/api/checkout", {method: "POST"});
      renderCart(await api("/api/cart"));
      say(`Order #${order.id} placed. You paid ${money(order.total)}.`, "ok");
    } catch (e) { say(e.message, "bad"); }
  });

  load();
</script>
</body>
</html>
